name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: dist/OutlookTool.exe
            asset: OutlookTool-Windows.exe
          - os: macos-latest
            bin: dist/OutlookTool
            asset: OutlookTool-macOS
          - os: ubuntu-latest
            bin: dist/OutlookTool
            asset: OutlookTool-Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        # python3-tk: Tk runtime for the GUI; libcairo2-dev + pkg-config: needed to
        # build pycairo (pulled in by xhtml2pdf -> svglib -> rlpycairo) from source,
        # since there is no pycairo wheel for the runner's Python on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libcairo2-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name OutlookTool --clean main.py

      - name: Stage artifact
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
